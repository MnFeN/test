<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日志解释器</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 800px;
            width: 100%;
        }
        
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 28px;
        }
        
        .section {
            margin-bottom: 25px;
        }
        
        .section-title {
            font-size: 16px;
            font-weight: 600;
            color: #555;
            margin-bottom: 10px;
        }
        
        textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-family: "Consolas", "Monaco", "Courier New", monospace;
            font-size: 14px;
            resize: vertical;
            transition: border-color 0.3s;
        }
        
        textarea:focus {
            outline: none;
            border-color: #667eea;
        }
        
        #logInput {
            min-height: 150px;
        }
        
        #logOutput {
            min-height: 150px;
            background-color: #f5f5f5;
        }
        
        .button-container {
            text-align: center;
            margin: 25px 0;
        }
        
        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 40px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 25px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
        }
        
        button:active {
            transform: translateY(0);
        }
        
        .info {
            background-color: #f0f4ff;
            border-left: 4px solid #667eea;
            padding: 12px;
            border-radius: 4px;
            margin-top: 20px;
            font-size: 14px;
            color: #555;
        }
        
        .info strong {
            color: #667eea;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📝 日志解释器</h1>
        
        <div class="section">
            <div class="section-title">需要解释的日志行：</div>
            <textarea id="logInput" placeholder="请输入日志行，每行一条&#10;例如：&#10;01 这是第一条日志&#10;02 这是第二条日志&#10;03 这是第三条日志"></textarea>
        </div>
        
        <div class="button-container">
            <button id="convertButton">🔄 转换</button>
        </div>
        
        <div class="section">
            <div class="section-title">解释结果：</div>
            <textarea id="logOutput" readonly placeholder="转换结果将显示在这里..."></textarea>
        </div>
        
        <div class="info">
            <strong>使用说明：</strong> 输入的日志行前两个字符应为十六进制数字（00-FF）。系统会根据类型号调用相应的解析器。当前支持类型：01、02、03。
        </div>
    </div>
    
    <!-- Load scripts in order: Base class first, then subclasses, then app -->
    <script src="js/parsers/BaseParser.js"></script>
    <script src="js/parsers/Parser01.js"></script>
    <script src="js/parsers/Parser02.js"></script>
    <script src="js/parsers/Parser03.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
